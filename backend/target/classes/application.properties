server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bloodbankdb
spring.datasource.username=root
spring.datasource.password=Root@2005

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.h2.console.enabled=false

spring.application.name=BloodBank API

app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,null

app.donation.cooldown.months=3

app.donor.max-failed-attempts=5

logging.level.com.bloodbank=INFO